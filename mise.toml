min_version = "2026.6.1"

[settings]
experimental = true   # required for [hooks] task references
lockfile = true       # maintain mise.lock for reproducible installs

[tools]
go = "1.26"
golangci-lint = "latest"  # Go meta-linter (lint:go)
gofumpt = "latest"        # stricter gofmt — single fmt source of truth
shellcheck = "latest"     # lint the .mise/ task scripts (lint:shell)
hk = "latest"             # git-lifecycle hook manager (sister project of mise); drives hk.pkl
pkl = "latest"            # config language hk.pkl is written in (hk evaluates it)
# eza ships no macOS binary on GitHub; aqua provides Linux (CI/devcontainer).
# On macOS install via `brew install eza`.
"aqua:eza-community/eza" = { version = "latest", os = ["linux"] }

[env]
# Run hk git hooks via `mise x` so pinned tools (go, golangci-lint, hk…) resolve
# even for contributors/agents who haven't activated mise in their shell.
HK_MISE = 1

# --- Hooks ------------------------------------------------------------------
# "Open the repo → everything ready." Entering the project installs tools, then
# self-installs the hk git hooks. Both steps are idempotent, so re-entry is cheap.
[hooks]
enter = ["mise install"]
postinstall = [{ task = "setup" }, "hk install --mise"]

# --- Orchestration ----------------------------------------------------------
# Leaf tasks live as scripts in .mise/tasks/ (auto-discovered). These are the
# aggregates: parallel DAGs over the leaf tasks.

[tasks.setup]
description = "Download Go module dependencies"
run = "go mod download"

[tasks.vet]
description = "go vet — all packages"
run = "go vet ./..."

[tasks.build]
description = "go build — all packages"
run = "go build ./..."

# Language-scoped gates. dev-kit is polyglot: Go runtime modules (jetbroker, …)
# and Node/TS build-time factories (coder-i18n). Each language has its own gate;
# `check` runs both, while the hk hooks (hk.pkl) run only the gate whose files
# changed, so a Go-only commit never spins up Node and vice versa.
[tasks."check:go"]
description = "Go quality gates (vet + golangci-lint + gofumpt --check + shellcheck)"
depends = [
  "vet",
  "lint:go",
  "lint:shell",
  { task = "fmt", args = ["--check"] },
]

[tasks."check:i18n"]
description = "coder-i18n factory gate (biome + tsc), via its own toolchain"
run = "mise -C coder-i18n run check"

[tasks.check]
description = "All quality gates (Go + i18n factories)"
depends = ["check:go", "check:i18n"]

[tasks.ci]
description = "Full local CI: quality gates + build + test"
depends = ["check", "build", "test"]
