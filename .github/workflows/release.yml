name: Release

# Tag a release commit `vX.Y.Z` (`git tag -a vX.Y.Z && git push origin vX.Y.Z`).
# This verifies the tagged commit, extracts its CHANGELOG.md section as the release
# notes, and publishes a GitHub Release. The Go module itself is "published" simply by
# the tag existing — proxy.golang.org serves it on first `go get …@vX.Y.Z`.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions: {}

jobs:
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release + upload notes
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Same pinned toolchain as CI; gate the release on a green build/test/lint.
      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
      - name: Verify the tagged commit (lint, build, test)
        run: mise run ci

      - id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          awk -v ver="$VERSION" '
            BEGIN { esc = ver; gsub(/\./, "\\.", esc) }
            !started && $0 ~ "^(##|####) +\\[?"esc"\\]?( |$)" { started = 1; next }
            started && /^(##|####) +\[?[0-9]/ { exit }
            started { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::No CHANGELOG.md section found for version $VERSION"
            exit 1
          fi

      - uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          body_path: release-notes.md
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
          prerelease: ${{ contains(github.ref_name, '-') }}
